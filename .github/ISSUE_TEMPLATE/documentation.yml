name: Documentation Request
description: Report a gap, a mistake or an improvement in the documentation
title: '[Docs]: '
labels: ['documentation', 'triage']
assignees: ['fbuireu']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation! A document that describes code that no longer exists is a bug here, not a nit.
  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: Which document is it about?
      options:
        - README
        - CLAUDE.md guides
        - CONTEXT.md glossary
        - ARCHITECTURE.md
        - An ADR
        - The wiki
        - CONTRIBUTING
        - Other
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Documentation
      description: What is currently documented (if anything)? Quote it.
      placeholder: The current documentation says...
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, or incorrect?
      placeholder: The documentation doesn't explain...
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should the documentation be improved?
      placeholder: The documentation should include...
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a PR to improve this documentation
