name: Prepare environment
description: Sets up pnpm, Node.js and dependencies

inputs:
  registry-url:
    description: npm registry to write into .npmrc, for a job that publishes
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Verify .nvmrc is present
      shell: bash
      run: |
        if [ ! -f .nvmrc ]; then
          echo '::error::.nvmrc is missing: it is what every job installs Node from'
          exit 1
        fi
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
